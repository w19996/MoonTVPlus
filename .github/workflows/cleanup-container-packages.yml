name: Cleanup unused container packages

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  delete-packages:
    runs-on: ubuntu-latest
    steps:
      - name: Delete unused container packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          gh api --silent --method DELETE \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/users/${OWNER}/packages/container/moontvplus"
          gh api --silent --method DELETE \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/users/${OWNER}/packages/container/moontvplus-lite"
